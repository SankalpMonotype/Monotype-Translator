brand_context_task:
  description: >
    Step 1: Call the read_brand_context_cache tool with knowledge_dir="{knowledge_dir}".
    - If it returns non-empty content: output that content directly as your final result.
      Do NOT call any other tools. The cache is valid because the knowledge files are unchanged.
    - If it returns an empty string: the cache is missing or stale. Proceed to Step 2.

    Step 2: Call the read_brand_guidelines tool with knowledge_dir set to "{knowledge_dir}".
    Read all files in that directory (brand_guidelines.md and glossary.md at minimum).

    Step 3: Use the ScrapeWebsiteTool to fetch content from the following Monotype web
    properties for additional product context and font terminology:
    - https://www.myfonts.com/ — font discovery platform; note product categories,
      featured collections, and any UI copy that reveals naming conventions.
    - https://www.myfonts.com/collections/ — browse font collections for terminology
      around styles, moods, and font categories used on the platform.

    Step 4: Synthesise ALL gathered content into a structured brand context document
    with these sections:

    1. TONE OF VOICE: Key adjectives describing Monotype's communication style and
       tones to avoid.
    2. UNTRANSLATABLE TERMS: An exhaustive list of product names, feature names, and
       brand terms that must remain in English in all translations (e.g. "Monotype AI",
       "Font Manager", "Mosaic", "MyFonts", "Fonts.com", "WhatTheFont"). Supplement
       with any additional product/feature names observed on MyFonts.com.
    3. PLACEHOLDER RULES: Explain that runtime variable tokens — those using a single
       pair of curly braces around a variable name, or a double pair of curly braces
       around a variable name — must be copied character-for-character into every
       translation. Do not translate, move, or reformat them.
    4. PER-LANGUAGE NOTES: Formality level, register, and writing system choices for
       French, German, pt-BR, Japanese, and es-ES.
    5. GLOSSARY: Key typography and product terminology with approved translations per
       language. Supplement the knowledge-file glossary with any additional font category
       or UI terms discovered on MyFonts.com.

    Step 5: Call the save_brand_context_cache tool with:
    - content = the full brand context document you just synthesised
    - knowledge_dir = "{knowledge_dir}"
    This saves the document so future runs can skip Steps 2-4 entirely.

    This document will be used by the translator and reviewer as their primary reference.
  expected_output: >
    A structured markdown document with the five sections above, grounded in the knowledge
    files and Monotype web properties. Do not invent guidelines — only surface what the
    sources say. If a section has no coverage, write "No specific guidance found — apply
    general professional localisation standards."
  agent: brand_analyst

translation_task:
  description: >
    Step 1: Call the read_excel_for_translation tool with:
    - excel_path = "{excel_path}"
    - row_limit = {row_limit}
    - target_languages = "{target_languages_str}" (comma-separated string, e.g.
      "ja" or "fr,de,pt_BR,ja,es_ES")
    This returns a JSON object containing "rows_to_translate" (an array of up to {row_limit}
    rows that are missing one or more of the requested language translations) and
    "column_map" (showing which Excel columns map to each language).
    If "rows_needing_translation" is 0, all strings are already done — skip directly
    to producing an empty JSON array [] as your output.

    Step 2: Using the brand context document from the brand_context_task as your
    primary reference, translate every row in "rows_to_translate" into these
    target languages: {target_languages}

    CRITICAL RULES — violation of these will break production:
    - Preserve ALL placeholder tokens verbatim: single-brace tokens with identifier names,
      double-brace tokens, %s, %d, %1$s, positional tokens like {0}, and bracket tokens
      like [name]. Copy them character-for-character. Do not translate, reorder, or reformat them.
    - EXCEPTION — Link-anchor label tokens: when a single-brace token contains a human-readable
      multi-word label like "Terms of Use", translate the text inside the braces while keeping
      the brace syntax intact. Per-language translations for that specific token:
        French  → write the token as: brace + Conditions d'utilisation + brace
        German  → write the token as: brace + Nutzungsbedingungen + brace
        pt-BR   → write the token as: brace + Termos de Uso + brace
        Japanese → write the token as: brace + 利用規約 + brace
        es-ES  → keep the token unchanged as: brace + Terms of Use + brace (brand-approved)
    - Japanese ONLY: when any count variable (e.g. "{{user.count}}") refers to users, always
      add the counter 人 with a space — write "{{user.count}} 人のユーザー" (space before 人),
      never "{{user.count}}人のユーザー" (no space) or "{{user.count}} ユーザー" (no 人).
    - ALL languages: "Monotype" and all Monotype product names — MyFonts, Fonts.com,
      Monotype Fonts, Monotype AI, Mosaic, SkyFonts — must stay in their exact English
      form in every language. NEVER translate, adapt, or transliterate them
      (e.g. NEVER "モナタイプ" for "Monotype" in Japanese).
    - Japanese ONLY: Short brand attribution strings — "Made with ♡", "by Monotype.",
      "Powered by Monotype" and similar footer/tagline strings — must be left
      UNTRANSLATED. Copy them verbatim from English.
    - Global tone setting: {tone}. Apply across all languages where register allows.
    - German: use formal "Sie". French: use formal "vous". Japanese: use 丁寧語 (polite
      register). pt-BR: use "você". es-ES: use "tú" throughout, informal and conversational
      tone — NEVER usted (except strictly legal/contractual text). When tone is "informal",
      prefer shorter, more direct phrasing in all languages.
    - German dialog patterns — FOUR DISTINCT FORMS (apply based on English string type):
      (1) "You are about to X" notification → "Sie sind dabei, X zu [infinitive]."
          e.g. "Sie sind dabei, {{user.count}} Benutzer zu deaktivieren." — NEVER Möchten Sie for this.
      (2) Short dialog title "Deactivate X users?" (3-6 word label, no full sentence) → "[obj] [infinitive]?"
          e.g. "{{user.count}} Benutzer deaktivieren?" — do NOT expand to Möchten Sie form.
      (3) Confirmation question in body text or standalone "Are you sure?" → "Möchten Sie [obj] wirklich [verb]en?"
          e.g. "Möchten Sie diesen Benutzer wirklich löschen?" — NEVER "Sind Sie sicher, dass Sie..."
          Body text with "Once deactivated/activated" prefix uses: "Nach der Deaktivierung/Aktivierung
          können/kann diese/r Benutzer [nicht mehr] auf das System zugreifen. Möchten Sie wirklich
          alle {{user.count}} Benutzer deaktivieren/aktivieren?" (consequence FIRST, question SECOND).
          e.g. "Nach der Deaktivierung können diese Benutzer nicht mehr auf das System zugreifen.
          Möchten Sie wirklich alle {{user.count}} Benutzer deaktivieren?"
      (4) Affirmation button e.g. "Yes, deactivate X users." → "Ja, [obj] [INFINITIVE]." — object first, verb LAST.
          e.g. "Ja, {{user.count}} Benutzer deaktivieren." — NEVER "Ja, deaktivieren Sie {{user.count}} Benutzer."
    - French button labels: standalone action labels and "Oui, X" buttons use INFINITIVE — not "vous" imperative.
      e.g. "Activer tous les utilisateurs", "Révoquer toutes les invitations",
      "Oui, désactiver {{user.count}} utilisateurs." — NEVER "Activez", "Révoquez", "Oui, désactivez".
      Reserve "vous" imperative (Vérifiez, Choisissez) for sentence-level instructions only.
    - French confirmation dialog body: consequence sentence FIRST, "Êtes-vous sûr" question SECOND.
      NEVER reverse the order. ALWAYS "Êtes-vous sûr de vouloir [infinitive]...?" — NEVER "Voulez-vous vraiment".
      e.g. "Une fois désactivés, ces utilisateurs ne pourront plus accéder au système. Êtes-vous sûr de
      vouloir désactiver tous les {{user.count}} utilisateurs ?"
      e.g. "Une fois désactivé, cet utilisateur ne pourra plus accéder au système. Êtes-vous sûr de
      vouloir désactiver l'utilisateur ?"
    - French typography: use a regular space (U+0020) — not a non-breaking space — before ?, !, :, ;
    - es-ES INFINITIVE vs IMPERATIVE (critical distinction):
      Standalone button labels and "Sí, X" confirmation buttons → INFINITIVE:
      Activar/Desactivar/Revocar/Seleccionar/Eliminar/Obtener/Configurar/Separar/Introducir/Buscar.
      e.g. "Activar todos los usuarios", "Sí, desactivar {{user.count}} usuarios.", "Sí, eliminar y transferir".
      tú imperative forms (Activa, Desactiva, Revoca, Busca) → ONLY for sentence-level copy addressing user.
      es-ES pronouns: tu/tus — NEVER su/sus. State verbs: estás/tienes/quieres — NEVER está/tiene/quiere.
      es-ES confirmations: "¿Seguro que quieres X?" — NEVER "¿Está seguro de X?".
      "You are about to X" → "Estás a punto de X" — NEVER "Está a punto de X".
      es-ES personal 'a': use only before singular definite human nouns: "desactivar a un usuario",
      "desactivar a este usuario", "Si desactivas a este usuario". NEVER before count variables or "todos":
      "desactivar {{user.count}} usuarios" (no 'a'), "activar {{user.count}} usuarios" (no 'a'),
      "Activar todos los usuarios" (no 'a'), "desactivar los {{user.count}} usuarios" (no 'a').
      es-ES "Once deactivated" → "Si los desactivas, no podrán acceder al sistema." (NOT "Una vez desactivados").
      es-ES "Once activated" → "Si los activas, podrán acceder al sistema." (NOT "Una vez activados").
      Singular: "Si desactivas a este usuario, no podrá acceder al sistema."
      e.g. Full pattern: "Si los desactivas, no podrán acceder al sistema. ¿Seguro que quieres desactivar
      los {{user.count}} usuarios?"
    - Japanese: NEVER add 本当に to confirmation strings. Use only よろしいですか？ at end.
      User account deactivate/activate: 無効化する/有効化する — NEVER 無効にする/有効にする.
      Font activation uses "アクティベートする/アクティベートされました" (NOT 有効化する).
      e.g. "Fonts activated" → "フォントがアクティベートされました", "Activated Fonts" → "アクティベートされたフォント".
      "You are about to X" → X+しようとしています — NEVER X+するところです.
      e.g. "無効化しようとしています" NOT "無効化するところです".
      No これから or 一度 prefixes in "You are about to" or "Once deactivated" strings.
      "Delete users" count label: "ユーザーを削除 （{{user.count}}人）" — space before （, fullwidth parens,
      人 immediately after variable with NO space inside parens: （{{user.count}}人）.
      "Permanent" → "永続的" (NOT "パーマネント"). "Auto" → "自動".
      "Give us a moment..." → "しばらくお待ちください...".
      "Sync and Downloads" → "同期とダウンロード" (NOT "同期＆ダウンロード").
      Japanese action labels (standalone buttons/labels): for 有効化/無効化 as the FINAL element in a
      label, OMIT する. e.g. "Activate all users" → "すべてのユーザーを有効化" (NOT "有効化する").
      EXCEPTION: "Set expiry date" → "有効期限を設定する" (keep する — already established).
      Japanese negative/empty-state sentences: use は particle, NOT が.
      e.g. "No inactive users available" → "非アクティブユーザーはいません" (NOT がいません).
      "You don't have any Inactive users currently…" → "現在、非アクティブユーザーはいません…"
      Japanese "No X yet" empty states: prefix with まだ, placed BEFORE the noun phrase.
      e.g. "No fonts approved yet" → "まだ承認済みのフォントがありません" (NOT "承認されたフォントはまだありません").
      e.g. "No users added yet" → "まだユーザーが追加されていません".
      Japanese "No X available" (short labels): "Xはいません" — no 利用できる prefix.
      e.g. "No inactive users available" → "非アクティブユーザーはいません" NOT "利用できる非アクティブユーザーがいません".
      Japanese delete/action confirmations: use てよろしいですか？ NEVER てもよろしいですか？
      e.g. "Are you sure you want to delete this user?" → "このユーザーを削除してよろしいですか？"
      e.g. "Once deactivated…よろしいですか？" — omit も throughout.
      Japanese "quarterly" → 四半期ごとの (adjective before noun) — always include ごとの.
      e.g. "quarterly usage" → "四半期ごとの使用状況" (NEVER "四半期ご利用状況" or "四半期使用状況").
      Japanese "branding" context: use 向けの (not 用の).
      e.g. "for branding" → "ブランディング向けの", "A modern serif font for branding" → "ブランディング向けのモダンなセリフ体フォント".
      "Monospaced" → "等幅フォント" (NOT just "等幅").
      "Which response would you prefer?" → "希望する提案を選択してください"
      "I prefer this response" → "この表現を希望します"
      "total fonts activated" → "アクティベートされたフォントの合計"
      Japanese {{count}} counter: when {{count}} represents a countable number of items
      (fonts, users, projects, etc.), always append 件 immediately after the variable —
      write "{{count}}件". When the count appears mid-sentence use 件中: "{{count}}件中{{count}}件".
      NEVER leave a bare {{count}} without the 件 suffix when it represents a quantity.
      e.g. "Web projects {{count}}" → "ウェブプロジェクト（{{count}}件）"
      e.g. "{{count}} of {{count}} used" → "{{count}}件中{{count}}件が使用済み"
      EXCEPTION: when {{count}} is already inside a Japanese counter phrase like
      "{{user.count}} 人のユーザー", the 人 counter applies instead of 件.
      Japanese brackets: ALWAYS use full-width brackets （ ） — NEVER ASCII ( ) — when
      wrapping a count or parenthetical in Japanese text.
      e.g. "（{{count}}件）" NOT "({{count}}件)" or "（{{count}} 件）".
      Japanese confirmation/success messages: use ACTIVE voice (〜しました, 〜を追加しました)
      — NEVER passive voice (〜されました, 〜が追加されました) for toast/success notifications.
      e.g. "{{styleName}} added to Favourites." → "{{styleName}}をお気に入りに追加しました。"
      e.g. "Font activated." → "フォントをアクティベートしました。"
      Japanese button labels (standalone UI labels, NOT full sentences): OMIT trailing する.
      e.g. "Retain the fonts" → "フォントを保持" NOT "フォントを保持する"
      e.g. "Notify admin" → "管理者に通知" NOT "管理者に通知する"
      e.g. "Ignore conflict" → "競合を無視" NOT "競合を無視する"
      Japanese "Leaving" / "Leaves" in font-lifecycle context means the font is being
      DISCONTINUED/RETIRED — translate as 提供終了 (end of service), NEVER as 出発 (departure).
      e.g. "Leaving in {{count}} days" → "{{count}}日後に終了"
      e.g. "Leaving earliest" → "終了日が早い順"
      e.g. "font leaves the Monotype Library" → "Monotypeライブラリから提供終了となった"
      Japanese "Filter by" / "filter" UI labels: use フィルター (noun) or 絞り込み —
      NEVER フィルタリング (verbal form).
      e.g. "Filter by:" → "フィルター："
      e.g. "Filter by glyphs" → "グリフで絞り込み"
      Japanese UI operation labels: prefer native Japanese vocabulary over katakana
      transliterations for action-category headings and section labels:
      "Bulk action" → 一括操作 (NEVER バルクアクション)
      "Additional actions" → その他の操作 (NEVER 追加アクション)
      "Sort" (section/menu label) → 並べ替え (NEVER ソートラベル or bare ソート)
      "Total results" → 総件数 (NEVER 合計結果)
      "Table" (as list/grid view label) → 一覧 (NEVER テーブル)
      "Go forward" / forward navigation → 次へ (NEVER 進む)
      "Pairs well with" (font pairing context) → 相性の良いペア
      Japanese role and access scope labels: use descriptive native Japanese, NOT katakana:
      "Collaborator" → 共同編集者 (NEVER コラボレーター)
      "Full-access" → すべての権限 (NEVER フルアクセス)
      "Only me" (privacy/sharing scope) → 自分のみ (NEVER 私だけ)
      Japanese "Updates" (software update noun or section heading) → アップデート —
      NEVER 更新 (更新 is reserved for "Refresh"; アップデート is for software version updates).
      e.g. "Updates" as a menu/section label → "アップデート"
      Japanese marketing and tagline copy: DO NOT translate word-for-word. Adapt naturally
      to preserve tone and punch — brevity and naturalness over literal fidelity.
      English puns or playful strings should become equally natural/punchy in Japanese,
      even if the literal words differ.
      e.g. "Making Helvetica proud." → "Helveticaも納得の仕上がりに" (NOT "ヘルベチカを誇りに思います。")
      e.g. "Designers will notice. Trust us." → "気づく人には、ちゃんと伝わる" (NOT literal)
      e.g. "You are looking font-astic today." → "今日のあなた、font-astic。" (keep English wordplay)
    - pt-BR: use "Busque fontes" (not Pesquise), "A função AI Search" (not A Busca por IA),
      "Eu prefiro essa resposta" (essa not esta), "Sincronização e downloads" (singular, not Sincronizações).
      pt-BR article for "Monotype Fonts": always use "a Monotype Fonts" (feminine article) when
      it is the subject/object of a sentence. e.g. "Com a Monotype Fonts, é fácil…" (NOT "Com Monotype Fonts").
    - pt-BR confirmation dialog body: start with "Após a desativação/ativação, esses/este usuário(s)..." —
      NEVER "Uma vez desativados/ativados...".
      e.g. "Após a desativação, esses usuários não poderão acessar o sistema. Tem certeza de que deseja
      desativar todos os {{user.count}} usuários?" and "Após a desativação, este usuário não poderá
      acessar o sistema. Tem certeza de que deseja desativar o usuário?"
    - French: use "Vérifiez" (not Consultez), "envoyez votre rapport" (not soumettez),
      "Étiquette" for Label (not Libellé), "Obtenir des polices similaires" for Get similar fonts.
    - German: "Label" stays as "Label" (English loanword) — NEVER Bezeichnung/Beschriftung/Etikett.
      "Font(s)" stays as "Font(s)" in German — NEVER translate to "Schrift(en)". Examples:
      "Noch keine Fonts genehmigt", "Aktivierte Fonts", "Erkundete Fonts",
      "Insgesamt aktivierte Fonts", "Font-Vorschläge", "Fonts hier angezeigt",
      "Fonts abgelehnt", "Fonts widerrufen". EXCEPTION: "Ähnliche Schriften anzeigen" for "Get similar fonts".
      EXCEPTION 2: "Modern sans-serif fonts for campaigns" → "Moderne serifenlose Schriftarten für Kampagnen"
      (use Schriftarten in this specific marketing context, not Fonts).
      "Permanent" → "Dauerhaft". "Temporary" → "Temporär". "Auto" → "Automatisch".
      "Sync and Downloads" → "Synchronisierung und Downloads" (NOT "Sync & Downloads").
      "Service" stays as "Service" (English loanword) — NEVER "Dienst".
      "Try X" → "Versuchen Sie X" — NEVER "Probieren Sie" for "Try" commands.
      e.g. "Try out AI mode" → "Versuchen Sie den KI-Modus", "Try our AI mode" → "Versuchen Sie unseren KI-Modus".
      "[X] will appear here for you to take action" → passive construction: "werden die [X] hier angezeigt, sodass Sie entsprechende Maßnahmen ergreifen können".
      "Fragen Sie mich alles..." for "Ask me anything" — NEVER "Frag mich alles" (du form).
      German "quarterly" → "vierteljährlich" — NEVER "quartalsweise".
      e.g. "Review your quarterly usage" → "Überprüfen Sie Ihre vierteljährliche Nutzung".
      German "Empty state illustration" → "Leerer Status" (NOT "Leere-Zustand-Abbildung" or similar).
      German "Monospaced" → "Monospaced" (keep as English loanword — NOT "Monospace" or "Monodistanzschrift").
      German "Font Philosopher says..." → "Font Philosopher sagt..." (keep "Font Philosopher" in English).
      German "Informed for production" → "Zur Produktion vorgemerkt".
      German "[N] style(s) are informed to be marked for production" → "[N] Stile wurden zur Produktion vorgemerkt."
      German "Access Key" / "Copy Access Key" → "Zugriffsschlüssel" / "Zugriffsschlüssel kopieren" (NOT "Zugangsschlüssel").
    - French: "Vérifiez" (not Examinez/Consultez).
      "Auto" stays as "Auto" (do NOT translate to "Automatique").
      "[X] will appear here for you to take action" → "pour que vous puissiez prendre les mesures nécessaires".
      e.g. "les polices apparaîtront ici pour que vous puissiez prendre les mesures nécessaires."
      French "No X yet" empty states: use "pour l'instant" — NEVER "pour le moment".
      e.g. "No fonts approved yet" → "Aucune police approuvée pour l'instant"
      e.g. "No fonts rejected yet" → "Aucune police refusée pour l'instant"
      French "Do not X" negative action labels: use INFINITIVE "Ne pas X".
      e.g. "Do not share assets" → "Ne pas partager les ressources" (NOT "Ne partagez pas les ressources").
      French "Give us a moment..." → "Donnez-nous un instant..."
      French "Monospaced" → "Monoespace" (NOT "Chasse fixe").
      French "Font Philosopher says..." → "Font Philosopher dit..." (keep "Font Philosopher" in English).
      French "total fonts activated" → "Nombre total de polices activées" (capital N).
      French "Informed for production" → "Prêt pour la production".
      French "[N] style(s) are informed to be marked for production" → "[N] style(s) sont marqués pour la production".
    - French: "tags" is an approved Monotype term — keep as "tags" in all contexts and strings.
      Never substitute "balises" regardless of surrounding copy.
    - French: for any action describing read or view access in a permission or capability context,
      use "Consulter" — never "Voir" or "Lire". "Consulter" carries the professional register
      appropriate for permission descriptions; "Voir" and "Lire" are too casual for that register.
    - French: "unmark" (removing a production marking from a font) → "retirer le marquage".
      Never use "Démarquer" (ambiguous) or "démarrer" (means "start").
    - French: when two actions are paired (approve/reject, mark/unmark, add/remove), join them
      with "ou" — never use a slash. This applies to all such pairs in any string.
    - French: preserve the syntactic structure of the English source — do not reorder constituents,
      nominalise verbs, or restructure clauses. Translate the words; keep the grammar shape.
    - pt-BR: "Label" → "Marcador" (not Etiqueta/Rótulo).
      "Auto" stays as "Auto" (do NOT translate to "Automático").
      "Sincronização e Downloads" — capital D in Downloads.
      "No X yet" short status labels: use just "Nenhuma X Y" without "ainda". e.g. "No fonts rejected yet" → "Nenhuma fonte rejeitada" (NOT "Nenhuma fonte rejeitada ainda").
    - es-ES: "Auto" stays as "Auto" (do NOT translate to "Automático").
      "[X] will appear here for you to take action" → "para que actúes como corresponda".
      e.g. "las fuentes aparecerán aquí para que actúes como corresponda."
      es-ES "Add" (action verb) → ALWAYS "Añadir" — NEVER "Agregar" (Latin American).
      e.g. "Añadir fuentes", "Añadir dominio", "Añadir usuario".
      es-ES "workspace" → "área de trabajo" — NEVER "espacio de trabajo".
      es-ES "features" (OpenType, UI features) → "características" — NOT "funciones".
      e.g. "Include OpenType features" → "Incluir características de OpenType".
      es-ES "specific" / "exact" (in UI copy qualifying a noun) → "concreto/a" — NOT "específico/a".
      e.g. "Enter specific characters" → "Introducir caracteres concretos".
      e.g. "Select specific languages" → "Selecciona los idiomas concretos que se admitirán".
      es-ES "Common characters" (UI label) → "Caracteres habituales" — NOT "comunes".
      es-ES "Embed code" (noun label) → "Código de incrustación" — NOT "Código incrustado".
      es-ES "No users found to export" → "No se han encontrado usuarios que exportar" (relative clause form).
      es-ES "Failed to export data. Retry" → "No se han podido exportar los datos. Reintentar".
      es-ES "Retry" (standalone button) → "Reintentar" — NOT "Inténtalo de nuevo".
      es-ES "revoke invite" (status label, past action) → "Invitación revocada" (past participle noun phrase).
    - pt-BR and es-ES: the abbreviation "AI" in general UI text → "IA".
      e.g. "AI mode" → "Modo IA", "Try out AI mode" → "Experimente o modo IA" (pt-BR) /
      "Prueba el modo IA" (es-ES), "Meet AI mode" → "Conheça o modo IA" / "Descubre el modo IA".
    - "AI Search" product name — localisation by language (CRITICAL):
      UI button labels and standalone headings: keep as "AI Search" in all languages.
      When "AI Search" is the SUBJECT or OBJECT in a full sentence, localise as follows:
        French:   "La recherche IA"
                  e.g. "La recherche IA fournit des recommandations intelligentes..."
                  e.g. "La recherche IA peut commettre des erreurs ; vérifiez les informations importantes."
        German:   "die KI-Suche" (declined: Die KI-Suche / die KI-Suche / der KI-Suche)
                  e.g. "Die KI-Suche liefert intelligente Empfehlungen..."
                  e.g. "Überprüfen Sie wichtige Informationen, da die KI-Suche Fehler machen kann."
        Japanese: "AI検索"
                  e.g. "AI検索はミスをすることがあるので、重要な情報はご自身でご確認ください。"
        es-ES:   "La función AI Search" (keep product name, add "La función" prefix)
                  e.g. "La función AI Search puede cometer errores, comprueba la información importante."
        pt-BR:    "A função AI Search" (keep product name, add "A função" prefix)
                  e.g. "A função AI Search pode cometer erros, verifique as informações importantes."
    - es-ES: use "todavía" for "yet" — NEVER "aún".
      e.g. "No hay fuentes aprobadas todavía", "No hay fuentes rechazadas todavía".
    - es-ES vocabulary — use Castilian Spanish terms in all contexts, never Latin American variants:
      "settings/ajustes" not "configuración"; "subir" not "cargar" for upload;
      "pertenencia" not "membresía"; prefer native Castilian equivalents over Anglicisms
      (e.g. "supervisión" not "monitoreo", "informe" not "reporte").
      When in doubt, choose the term used in Spain (Castilian) over the Latin American alternative.
    - es-ES: "output" when referring to font production output → "producción", never "salida".
    - es-ES: when two actions are paired (approve/reject, mark/unmark), join with "o" — never slash.
    - es-ES grammatical voice: the informal tú register applies only to second-person copy —
      strings where the user is the agent (what the user does, chooses, or sees).
      Impersonal and passive constructions must stay impersonal/passive regardless of tone setting.
      Any string describing a system state, system requirement, or system error uses impersonal SE
      (se debe, se puede, no se ha podido, no se han encontrado) — never convert these to tú forms.
      The tone setting does not change grammatical voice, only second-person address.
    - Brazilian Portuguese (not European Portuguese). Spain Spanish / Castilian (not Latin American).
    - For short UI labels (1-3 words), prioritise brevity and naturalness over literal fidelity.

    Output ONLY a valid JSON array. Each element must have exactly this structure:
    {
      "row_index": <integer — the exact row_index value from the tool output>,
      "english": "<the English string copied verbatim>",
      "<lang_code>": "<translation for that language>"
    }
    Include one key per target language from {target_languages} (e.g. "fr", "de", "pt_BR", "ja", "es_ES").
    Only include keys for the requested languages — do NOT add languages not in {target_languages}.

    Output the raw JSON array only. No markdown code fences. No preamble text.
    No trailing commentary. The array must be parseable by Python's json.loads().
  expected_output: >
    A valid JSON array of translation objects with keys: row_index, english, plus one key
    per requested language. Raw JSON only — no markdown, no preamble, no extra text.

  agent: translator
  context:
    - brand_context_task

review_task:
  description: >
    You will receive the brand context document (from brand_context_task) and the
    translation JSON array (from translation_task) via context.

    Review every entry in the array against this checklist for each translated language:
    [ ] Accuracy: Does the translation faithfully convey the English meaning?
    [ ] Brand voice: Does the tone match Monotype's guidelines?
    [ ] Placeholder integrity: Are ALL single-brace and double-brace variable tokens
        present, unchanged, and in a grammatically valid position?
        CRITICAL EXCEPTION — Link-anchor label tokens: The English source contains a
        single-brace token whose text reads "Terms of Use". This token MUST appear
        localised in French, German, pt-BR, and Japanese. The correct localised forms are:
          French   → brace + Conditions d'utilisation + brace
          German   → brace + Nutzungsbedingungen + brace
          pt-BR    → brace + Termos de Uso + brace
          Japanese → brace + 利用規約 + brace
          es-ES   → brace + Terms of Use + brace (unchanged — brand-approved)
        If you see brace + Conditions d'utilisation + brace in the French output, that is
        CORRECT — do NOT revert it to brace + Terms of Use + brace. Same for the other
        localised forms. Only the es-ES output keeps brace + Terms of Use + brace.
    [ ] Untranslatable terms: Are product names kept in English?
    [ ] Natural fluency: Would a native speaker find this natural in a UI context?
    [ ] Brevity: Are short UI labels appropriately compact?
    [ ] es-ES register: Check sentence-level copy uses tú forms (estás, tienes, quieres,
        tu, tus). REJECT usted forms (Revise, Busque, Pruebe, su, sus, está, tiene, quiere).
        IMPORTANT: standalone button labels and "Sí, X" confirmation buttons correctly use
        INFINITIVE (Activar, Desactivar, Revocar, Seleccionar) — do NOT change those to tú imperatives.
        Personal 'a' is only correct before singular human nouns (un usuario, este usuario).
        REMOVE personal 'a' before count variables: "desactivar {{user.count}} usuarios" (no 'a').
    [ ] Japanese count variable spacing: verify "{{user.count}} 人のユーザー" has a space between
        the variable and 人. Correct to add the space if missing.
    [ ] AI Search sentence localisation: when "AI Search" appears as subject/object in a SENTENCE
        (not a standalone label), verify: FR uses "La recherche IA", DE uses "die KI-Suche",
        JA uses "AI検索", es-ES uses "La función AI Search", pt-BR uses "A función AI Search".
        Correct any language that kept "AI Search" in sentence context.
    [ ] Japanese は vs が particle: in negative/empty-state sentences, verify は is used not が.
        e.g. "非アクティブユーザーはいません" (correct). Fix if が is used.
    [ ] Japanese UI operation vocabulary: verify native terms — 一括操作 not バルクアクション,
        その他の操作 not 追加アクション, 並べ替え not ソート/ソートラベル, 総件数 not 合計結果,
        一覧 not テーブル (view label), 次へ not 進む.
    [ ] Japanese role/access labels: verify 共同編集者 not コラボレーター, すべての権限 not
        フルアクセス, 自分のみ not 私だけ.
    [ ] Japanese "Updates" (software noun): verify アップデート is used, not 更新.
    [ ] Japanese empty-state "No X yet": verify まだ is prefixed BEFORE the noun phrase.
        e.g. "まだ承認済みのフォントがありません". Fix if まだ is missing or placed mid-sentence.
    [ ] Japanese action label verb form: verify 有効化/無効化 standalone labels have NO trailing する.
        e.g. "すべてのユーザーを有効化" is correct. Fix "有効化する" → "有効化" in label context.
    [ ] Japanese confirmation verb: verify てよろしいですか？ — NOT てもよろしいですか？
    [ ] French "No X yet": verify "pour l'instant" is used (not "pour le moment").
    [ ] German "quarterly": verify "vierteljährlich" is used (not "quartalsweise").

    For any string that fails a check: correct it in-place in the JSON.
    For any string where you are uncertain after correction: add a "reviewer_note"
    field to that object explaining the concern (name the specific language).

    Return the complete corrected JSON array. Use exactly the same schema as the input
    (row_index, english, plus one key per translated language) plus optional reviewer_note.
    Output the raw JSON array only — no markdown, no preamble, no extra text.
  expected_output: >
    A valid JSON array with the same structure as the translator's output, corrections
    applied in-place, and optional reviewer_note fields where flagged. Raw JSON only.
  agent: translation_reviewer
  context:
    - brand_context_task
    - translation_task

production_task:
  description: >
    Step 1: Call the write_reviewed_translations_to_excel tool with:
    - excel_path = "{excel_path}"
    This tool reads the reviewed translations JSON file internally and writes all
    translations to the Excel file in one step.

    Step 2: Confirm the tool returned success=true. If it returned an error, report it clearly
    and stop. Do NOT write a summary if the tool returned an error.

    Step 3: Write a final production summary containing:
    - Output file path (the _translated.xlsx file created by the write tool)
    - Total rows written
    - Per-language counts (fr, de, pt_BR, ja, es_ES)
    - List of any row_index values that carried a reviewer_note (flagged strings)
    - Release recommendation: "READY FOR RELEASE" if no reviewer_notes were present,
      otherwise "REVIEW FLAGGED STRINGS BEFORE RELEASE"

    Do not alter any translation content.
  expected_output: >
    A plain-text production summary report with: output file path, rows written,
    per-language counts, flagged string list, and release recommendation.
  agent: production_manager
  context:
    - review_task

